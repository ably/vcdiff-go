name: CI

# Based upon:
#   https://github.com/actions/starter-workflows/blob/main/ci/go.yml

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.18', '1.19', '1.20', '1.21', '1.22', '1.23', '1.24', '1.25']

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download Packages
        run: go get -t -v ./...
      
      - name: Format
        run: if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then exit 1; fi

      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report@latest

      - name: Unit Tests
        run: |
          set -o pipefail
          go test -v ./... |& tee >(~/go/bin/go-junit-report > unit.junit)

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Go Tests (Go ${{ matrix.go-version }})
          path: unit.junit
          reporter: java-junit
          fail-on-error: true

      - name: Upload JUnit Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test-report-go-${{ matrix.go-version }}
          path: unit.junit